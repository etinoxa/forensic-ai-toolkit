# configs/presets/high_accuracy.yaml
# High accuracy configuration - slower but more thorough

audio:
  speaker_recognition:
    strategy: three_stage
    detector: titanet
    tertiary: wavlm
    fusion:
      alpha: 0.55
      tau_star: 0.75

vision:
  object_detection:
    strategy: two_stage
    verifier: deformable_detr
    gdino:
      box_threshold: 0.40
      text_threshold: 0.40
    fusion:
      rule: weighted
      tau_star: 0.65

  ocr:
    strategy: consensus
    engine_order: [paddle, trocr, donut, tesseract, doctr]
    rotations: [0, 90, 180, 270]

  face_recognition:
    recognizer: arcface
    thresholds: [0.85, 0.90, 0.95]