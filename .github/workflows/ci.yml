name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # If you don’t use `pip install -e .`, add your src to PYTHONPATH:
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
      - name: Run unit tests (fast)
        run: pytest -q --maxfail=1 -m "not slow"

  slow:
    needs: unit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
          # Optional: cache Hugging Face to speed up model pulls
          echo "HF_HOME=$GITHUB_WORKSPACE/.hf_cache" >> $GITHUB_ENV
      - name: Run slow tests (models)
        env:
          # Keep runs headless and CPU-only
          CUDA_VISIBLE_DEVICES: ""
          FAIT_LOG_LEVEL: "WARNING"
        run: pytest -q --maxfail=1 -m slow
