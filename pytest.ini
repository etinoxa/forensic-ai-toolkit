[pytest]
addopts =
    -q
    --cov=src/fait
    --cov-report=term-missing
    --cov-fail-under=40
    --ignore=tests/unit/vision/object_detection/test_yolo_parse.py
    --ignore=tests/unit/vision/object_detection/test_yolo_resolver.py
    --ignore=tests/unit/vision/object_detection/test_deformable_detr_parse.py
    --ignore=tests/unit/vision/object_detection/test_grounding_dino_parse.py

testpaths = tests
markers =
    slow: slow / downloads
    gpu: needs CUDA
    requires_models: tests that import model classes directly
    integration: marks tests as integration tests (run slower end-to-end flows)
filterwarnings =
    ignore:Protobuf gencode version.*:UserWarning:google.protobuf.runtime_version
    ignore:oneDNN custom operations are on:UserWarning